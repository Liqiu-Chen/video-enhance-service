<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VSR ×4 + RIFE ×2 推理服务</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e2229; --line:#2b3038;
    --fg:#e6e8ec; --dim:#9aa3af; --accent:#5aa9ff; --ok:#3fbf7f; --warn:#e0a24a; --err:#e2606a;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:14px/1.6 "Segoe UI","Microsoft YaHei",system-ui,sans-serif}
  .wrap{max-width:1000px;margin:0 auto;padding:28px 20px 60px}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:var(--dim);font-size:12.5px;margin-bottom:22px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;
        padding:18px;margin-bottom:16px}
  .card h2{font-size:14px;margin:0 0 14px;color:var(--accent);font-weight:600}
  .row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
  .f{display:flex;flex-direction:column;gap:5px;min-width:130px}
  .f label{font-size:12px;color:var(--dim)}
  input[type=file],input[type=text],select,input[type=number]{
    background:var(--panel2);border:1px solid var(--line);color:var(--fg);
    border-radius:7px;padding:7px 10px;font-size:13px;width:100%}
  button{background:var(--accent);color:#08121f;border:0;border-radius:7px;
         padding:9px 18px;font-size:13px;font-weight:600;cursor:pointer}
  button:hover{filter:brightness(1.1)}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.ghost{background:transparent;color:var(--dim);border:1px solid var(--line)}
  .bar{height:8px;background:var(--panel2);border-radius:5px;overflow:hidden;margin:12px 0 6px}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);transition:width .4s}
  .meta{color:var(--dim);font-size:12px;display:flex;gap:16px;flex-wrap:wrap}
  .pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;
        border:1px solid var(--line);color:var(--dim)}
  .pill.running{color:var(--accent);border-color:var(--accent)}
  .pill.done{color:var(--ok);border-color:var(--ok)}
  .pill.failed,.pill.cancelled{color:var(--err);border-color:var(--err)}
  .pill.queued{color:var(--warn);border-color:var(--warn)}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  td,th{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
  th{color:var(--dim);font-weight:500}
  video{width:100%;max-height:520px;border-radius:8px;background:#000;margin-top:12px}
  code{background:var(--panel2);padding:1px 6px;border-radius:4px;font-size:12px}
  .hint{color:var(--dim);font-size:12px;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <h1>VSR ×4 + RIFE ×2 推理服务</h1>
  <div class="sub">超分（BasicVSR++ / Real-ESRGAN，自动选）→ 2 倍插帧（RIFE）· 单 GPU 排队执行</div>
  <div class="sub" id="tunnel" style="margin-top:-14px"></div>

  <div class="card">
    <h2>① 提交任务</h2>
    <div class="row">
      <div class="f" style="flex:1;min-width:260px">
        <label>选择视频文件（≤512 MB）</label>
        <input type="file" id="file" accept="video/*">
      </div>
      <div class="f">
        <label>输出倍率</label>
        <select id="scale">
          <option value="2" selected>×2（推荐，先降采样再4x）</option>
          <option value="4">×4（原始 4 倍，输出大 4 倍）</option>
        </select>
      </div>
      <div class="f">
        <label>链路</label>
        <select id="interp">
          <option value="true">超分 + 插帧×2</option>
          <option value="false">只做超分</option>
        </select>
      </div>
      <div class="f">
        <label>时长</label>
        <select id="realtime">
          <option value="true">保持原时长（原速）</option>
          <option value="false">2 倍慢动作</option>
        </select>
      </div>
      <div class="f">
        <label>画质 CRF</label>
        <input type="number" id="crf" value="16" min="0" max="35">
      </div>
      <button id="go">开始推理</button>
    </div>
    <div class="hint">也可以用 API：<code>POST /api/jobs</code>（multipart 上传）或
      <code>POST /api/jobs/json</code>（指定服务器路径）。接口文档见 <a href="/docs" style="color:var(--accent)">/docs</a>。</div>
  </div>

  <div class="card" id="cur" style="display:none">
    <h2>② 当前任务 <span id="curid" class="pill"></span></h2>
    <div class="bar"><i id="bar"></i></div>
    <div class="meta">
      <span id="pct">0%</span><span id="stage">等待中</span>
      <span id="msg"></span><span id="eta"></span>
    </div>
    <div id="player"></div>
  </div>

  <div class="card">
    <h2>③ 任务列表</h2>
    <table>
      <thead><tr><th>ID</th><th>状态</th><th>源文件</th><th>进度</th><th>耗时</th><th></th></tr></thead>
      <tbody id="list"><tr><td colspan="6" style="color:var(--dim)">加载中…</td></tr></tbody>
    </table>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
let timer = null, curId = null;

// 访问令牌：从网址的 ?token=xxx 取，后续所有请求自动带上
const TOKEN = new URLSearchParams(location.search).get("token") || "";
if(!TOKEN){
  document.body.innerHTML = '<div style="max-width:460px;margin:15vh auto;padding:28px;'+
    'border:1px solid #2b3038;border-radius:10px;background:#171a21;color:#e6e8ec;'+
    'font:14px/1.7 \'Microsoft YaHei\',system-ui">'+
    '<h1 style="font-size:17px;color:#5aa9ff;margin:0 0 12px">需要访问令牌</h1>'+
    '请在网址后面加上 <code style="background:#1e2229;padding:2px 7px;border-radius:4px">'+
    '?token=你的令牌</code> 再访问。</div>';
  throw new Error("no token");
}
const api = (u, o = {}) => {
  o.headers = Object.assign({}, o.headers, { "X-API-Token": TOKEN });
  return fetch(u, o);
};
// 安全地读 JSON。
//
// 为什么需要：公网隧道断线时，服务商会直接返回纯文本 "no tunnel"（502）。
// 直接 r.json() 会抛 JSON 解析错，报出来是 "Unexpected token o" ——
// 因为 JS 引擎看到首字母 n 会去匹配 null，读到第二个字符 o 就不匹配了。
// 这个报错完全看不出真正原因，所以这里统一换成可读提示。
async function readJson(r){
  let txt;
  try { txt = await r.text(); }
  catch(e){ throw new Error("网络中断，连接被重置"); }
  try { return JSON.parse(txt); }
  catch(e){
    if(r.status === 502 || /no tunnel/i.test(txt) || txt.trim() === "")
      throw new Error("公网隧道已断开（免费隧道断线后会换地址，需要重新获取）。"
                    + "如果是局域网访问，请改用局域网地址。");
    throw new Error("服务返回了非预期内容（HTTP " + r.status + "）：" + txt.slice(0, 100));
  }
}
const tokUrl = u => u + (u.includes("?") ? "&" : "?") + "token=" + encodeURIComponent(TOKEN);

function fmt(s){ if(s==null) return "—"; s=Math.round(s);
  return s<60 ? s+"s" : Math.floor(s/60)+"m"+(s%60)+"s"; }

// 显示当前公网地址。免费隧道断线后会换域名，用户可以在这里查到最新的。
async function tunnelInfo(){
  try{
    const r = await readJson(await api("/api/tunnel"));
    const el = $("#tunnel");
    if(r.has_tunnel){
      el.innerHTML = '当前公网地址：<a style="color:var(--accent)" href="'+r.tunnel_url+'/?token='+
        encodeURIComponent(r.token)+'" target="_blank">'+r.tunnel_url+'</a>' +
        ' <span style="color:var(--dim)">（断线会自动更换，以这里显示的为准）</span>';
    }else{
      el.innerHTML = '<span style="color:var(--warn)">公网隧道未开启或已断开 —— '+
        '如果外部用户打不开，请让对方改用局域网地址，或重启 public.py</span>';
    }
  }catch(e){}
}

async function health(){
  try{ const r = await readJson(await api("/api/health"));
    $("#sub2") && ($("#sub2").textContent = r.gpu);
  }catch(e){}
}

async function submit(){
  const f = $("#file").files[0];
  if(!f){ alert("请先选择视频文件"); return; }
  const fd = new FormData();
  fd.append("file", f);
  fd.append("interp", $("#interp").value);
  fd.append("vsr_scale", $("#scale").value);
  fd.append("realtime", $("#realtime").value);
  fd.append("crf", $("#crf").value);
  $("#go").disabled = true; $("#go").textContent = "上传中…";
  try{
    const r = await api("/api/jobs", {method:"POST", body:fd});
    if(!r.ok){ const d = await readJson(r); throw new Error(d.detail || r.statusText); }
    const j = await readJson(r);
    curId = j.id; $("#cur").style.display = ""; $("#player").innerHTML = "";
    poll();
  }catch(e){ alert("提交失败：" + e.message); }
  finally{ $("#go").disabled = false; $("#go").textContent = "开始推理"; }
}

function render(j){
  const st = j.progress || {};
  $("#curid").textContent = j.id; $("#curid").className = "pill " + j.status;
  $("#bar").style.width = (st.pct||0) + "%";
  $("#pct").textContent = (st.pct||0).toFixed(0) + "%";
  const names = {decode:"解码", vsr:"超分 ×4", rife:"插帧 ×2", done:"完成", init:"准备"};
  $("#stage").textContent = names[st.stage] || st.stage || "";
  $("#msg").textContent = st.message || "";
  if(st.done && st.total){
    const el = st.elapsed_s || 0, remain = st.done ? (st.total-st.done)/(st.done/el) : 0;
    $("#eta").textContent = el ? ("已用 " + fmt(el) + " · 预计还需 " + fmt(remain)) : "";
  }
  if(j.status === "done" && !$("#player video")){
    const u = tokUrl("/api/jobs/"+j.id+"/result");
    $("#player").innerHTML = '<video controls autoplay src="'+u+'"></video>' +
      '<div class="hint">也可以直接下载：<a style="color:var(--accent)" href="'+u+'">'+j.id+'.mp4</a></div>';
  }
  if(j.status === "failed") $("#msg").textContent = j.error || "失败";
}

async function poll(){
  if(timer) clearTimeout(timer);
  try{
    const r = await api("/api/jobs");
    const js = (await readJson(r)).jobs || [];
    $("#list").innerHTML = js.length ? js.map(j=>{
      const st = j.progress||{};
      return '<tr><td><code>'+j.id+'</code></td>'+
        '<td><span class="pill '+j.status+'">'+j.status+'</span></td>'+
        '<td>'+j.src_name+' <span style="color:var(--dim)">'+(j.params.src_size_mb||"")+'MB</span></td>'+
        '<td>'+(st.pct!=null?st.pct.toFixed(0)+"%":"—")+'</td>'+
        '<td>'+(j.finished?fmt(j.finished-j.started):(j.started?"进行中":"排队"))+'</td>'+
        '<td>'+(j.download_url?'<a style="color:var(--accent)" href="'+tokUrl(j.download_url)+'">下载</a> ':'')+
          '<a style="color:var(--dim);cursor:pointer" onclick="del(\''+j.id+'\')">删除</a></td></tr>';
    }).join("") : '<tr><td colspan="6" style="color:var(--dim)">暂无任务</td></tr>';
    const me = curId && js.find(j=>j.id===curId);
    if(me){ render(me); if(me.status==="done"||me.status==="failed") { curId=null; } }
  }catch(e){}
  if(curId) timer = setTimeout(poll, 1500); else timer = setTimeout(poll, 4000);
}

async function del(id){ if(!confirm("删除任务 "+id+" 及其文件？")) return;
  await api("/api/jobs/"+id, {method:"DELETE"}); poll(); }

$("#go").onclick = submit;
health(); tunnelInfo(); poll(); setInterval(tunnelInfo, 30000);
</script>
</body>
</html>
